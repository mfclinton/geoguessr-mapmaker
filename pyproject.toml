[project]
name = "geoguessr-mapmaker"
dynamic = ["version"]
description = "Make GeoGuessr maps from GeoJSON, your Google Timeline, or code"
readme = "README.md"
license = "MIT"
authors = [{ name = "mfclinton" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.12",
    "pyproj>=3.6",
    "python-dotenv>=1.0",
    "rich>=13",
    "typer>=0.20",
]

[project.urls]
Homepage = "https://github.com/mfclinton/geoguessr-mapmaker"
Issues = "https://github.com/mfclinton/geoguessr-mapmaker/issues"

[project.scripts]
ggmm = "geoguessr_mapmaker.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/geoguessr_mapmaker/_version.py"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "C90", "ERA", "PT", "PYI", "RET", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/fake_geoguessr.py" = ["C901"]  # a fake server's request routing is branchy by nature

[tool.mypy]
strict = true
files = ["src", "examples"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: talks to the real GeoGuessr API; run with pytest -m live"]
